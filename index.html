<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/wannabe/favicon.svg" />
    <link rel="apple-touch-icon" href="/brand/wannabe/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFF6E5" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Fullstack Wannabe — design schemas, play SQL, master language data structures, and trace a request through a real backend architecture."
    />
    <title>Fullstack Wannabe — Schema to API, by hand</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Instrument+Sans:ital,wght@0,400..700;1,400..600&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Resolve the theme before first paint. Without this the app flashes
      // cream paper for a frame on every reload for anyone who chose dark.
      // The stored value is JSON (`"dark"`), so it is parsed, not compared raw.
      (function () {
        try {
          var raw = localStorage.getItem('fsw:theme');
          var theme = raw ? JSON.parse(raw) : 'light';
          if (theme === 'dark') document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          /* private mode — light is a safe default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
